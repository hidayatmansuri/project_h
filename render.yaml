databases:
  - name: project-h-db
    databaseName: projecthdb
    plan: free

services:
  - type: web
    name: project-h
    runtime: docker
    plan: standard
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: DJANGO_DEBUG
        value: "False"
      - key: SECURE_PROXY_SSL
        value: "True"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        sync: false
      - key: CSRF_TRUSTED_ORIGINS
        sync: false
      - key: PROJECTAUTH_BASE_URL
        sync: false
      - key: PROJECTAUTH_ENCRYPTION_KEYS
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: project-h-db
          property: connectionString
      - key: GUNICORN_WORKERS
        value: "2"
    disk:
      name: project-h-media
      mountPath: /app/media
      sizeGB: 2
