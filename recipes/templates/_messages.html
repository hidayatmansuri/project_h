{% if messages %}
<div class="sr-messages" style="max-width: 720px; margin: 20px auto;">
    {% for message in messages %}
    <div class="alert alert-{% if message.level_tag == 'error' %}danger{% elif message.level_tag %}{{ message.level_tag }}{% else %}info{% endif %}" role="alert">
        {{ message }}
    </div>
    {% endfor %}
</div>
{% endif %}
